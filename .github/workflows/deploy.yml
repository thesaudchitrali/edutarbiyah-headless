name: EduTarbiyah Static Build & Deploy

on:
  push:
    branches:
      - main
      - master
  repository_dispatch:
    types:
      - edutarbiyah_build_deploy
  workflow_dispatch:

concurrency:
  group: edutarbiyah-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Build API Responses
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-edutarbiyah-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-edutarbiyah-cache-

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Static Astro Site
        run: npm run build
        env:
          PUBLIC_WP_URL: 'https://edutarbiyah.com'

      - name: Deploy to Shared Hosting (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR || 'public_html/' }}
          local-dir: ./dist/
          dangerous-clean-slate: false
